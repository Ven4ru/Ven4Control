[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ven4control"
version = "0.2.0"
description = "Контролируй, логируй и управляй своими OpenWrt-роутерами и Ubuntu-серверами из одного окна"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "asyncssh>=2.20,<3",
    "keyring>=25,<26",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
]

[project.scripts]
ven4control = "ven4control.app:main"

[tool.setuptools.packages.find]
where = ["src"]
