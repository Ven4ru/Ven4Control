[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ven4control"
version = "0.1.0"
description = "Локальный менеджер SSH-устройств"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "asyncssh>=2.20,<3",
    "keyring>=25,<26",
]

[project.scripts]
ven4control = "ven4control.app:main"

[tool.setuptools.packages.find]
where = ["src"]
